<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 40px; }
    .box { max-width: 360px; margin: 0 auto; }
    input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; }
    .msg { margin-top: 12px; color: green; min-height: 1.2em; }
    .err { color: red; }
    .row { display:flex; align-items:center; gap:8px; }
    .small { font-size: 0.9em; color: #666; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <label for="username">Username</label>
    <input id="username" placeholder="Username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="row">
      <input id="remember" type="checkbox">
      <label for="remember" class="small">Remember password</label>
    </div>
    <button id="loginBtn">Log in</button>

    <div id="status" class="msg" aria-live="polite"></div>
  </div>

  <script>
    function setLocalStorage(key, val){
      try {
        if (val === undefined || val === null) {
          window.localStorage.removeItem(key);
        } else {
          window.localStorage.setItem(key, String(val));
        }
      } catch (e) {
        console.error('setLocalStorage error', e);
      }
    }
    function getLocalStorage(key){
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        console.error('getLocalStorage error', e);
        return null;
      }
    }

    // Read query parameters from a URL.
    function parseQueryParams(url) {
      try {
        const u = new URL(url, window.location.href);
        const params = Object.fromEntries(u.searchParams.entries());
        return params;
      } catch (e) {
        return {};
      }
    }

    document.addEventListener('DOMContentLoaded', function(){
      const usernameEl = document.getElementById('username');
      const passwordEl = document.getElementById('password');
      const rememberEl = document.getElementById('remember');
      const statusEl = document.getElementById('status');
      const loginBtn = document.getElementById('loginBtn');

      // Remember the password by default.
      rememberEl.checked = true;

      // Restore saved credentials.
      const savedUser = getLocalStorage('localUserName');
      const savedPass = getLocalStorage('localUserPassword');
      if (savedUser) usernameEl.value = savedUser;
      if (savedPass) passwordEl.value = savedPass;

      function showMessage(text, isError) {
        statusEl.textContent = text || '';
        statusEl.classList.toggle('err', !!isError);
        statusEl.classList.toggle('msg', !isError);
      }

      loginBtn.addEventListener('click', function(){
        const username = (usernameEl.value || '').trim();
        const password = (passwordEl.value || '').trim();

        // Validate credentials.
        if (!username) {
          showMessage('Please enter your username.', true);
          usernameEl.focus();
          return;
        }
        if (!password) {
          showMessage('Please enter your password.', true);
          passwordEl.focus();
          return;
        }

        showMessage('Logging in...', false);
        loginBtn.disabled = true;

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        }).then(async res => {
          loginBtn.disabled = false;

          // Parse the response.
          let data;
          try {
            data = await res.json();
          } catch (e) {
            showMessage('The server returned an invalid response.', true);
            console.error(e);
            return;
          }
          if (data && data.success) {
            showMessage('Login successful. Redirecting...', false);

            // Read the login callback parameters.
            if (data.successUrl) {
              try {
                const params = parseQueryParams(data.successUrl);
                if (params.authToken) setLocalStorage('localAuthToken', params.authToken);
                if (params.username) setLocalStorage('localUserName', params.username);
                // Save or remove the password according to the preference.
                if (document.getElementById('remember').checked) {
                  setLocalStorage('localUserPassword', password);
                } else {
                  setLocalStorage('localUserPassword', null);
                }

                // The client intercepts this redirect to complete login.
                const successUrl = new URLSearchParams(window.location.search).get('successUrl');
                const target = new URL(successUrl || data.successUrl, window.location.href);
                const loginParams = new URL(data.successUrl, window.location.href).searchParams;
                loginParams.forEach((value, key) => target.searchParams.set(key, value));
                window.location.href = target.href;
                return;
              } catch (e) {
                showMessage('Could not process the login callback: ' + e, true);
                return;
              }
            } else {
              showMessage('Login failed.', true);
            }
          } else {
            const msg = (data && data.msg) ? data.msg : 'Login failed. Please check your username and password.';
            showMessage(msg, true);
          }
        }).catch(err => {
          console.error('Network error', err);
          loginBtn.disabled = false;
          showMessage('Network error: ' + (err && err.message ? err.message : err), true);
        });
      });
    });
  </script>
</body>
</html>
